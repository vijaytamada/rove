# Production-style stack: Postgres, Redis, a one-off migration, the API and the website.
#
#   cp infra/production.env.example infra/production.env   # then fill in real values
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/production.env up -d --build
#
# What it does NOT include: TLS and a public entry point. Put a reverse proxy or load balancer in front (it must terminate
# HTTPS and OVERWRITE X-Forwarded-For with the real client address) and publish only that. The API refuses to start with
# the mock OTP, KYC and payment providers (by design), so a real launch needs Phases 9 and 10 finished first.
name: rove-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # Applies pending database migrations and exits. The API starts only after it succeeded.
  migrate:
    build:
      context: ../backend
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ../backend
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN to the website address}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      # One proxy (yours) sits in front of the API and the website.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      OTP_PROVIDER: ${OTP_PROVIDER:-mock}
      KYC_PROVIDER: ${KYC_PROVIDER:-mock}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-mock}
      TELEMETRY_PROVIDER: ${TELEMETRY_PROVIDER:-mock}
      KYC_WEBHOOK_SECRET: ${KYC_WEBHOOK_SECRET:?set KYC_WEBHOOK_SECRET}
      TELEMETRY_INGEST_KEY: ${TELEMETRY_INGEST_KEY:?set TELEMETRY_INGEST_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # Published on this machine only; the reverse proxy forwards to it.
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"

  frontend:
    build:
      context: ../frontend
      args:
        # The API address as the website's server reaches it (inside this network). Baked in at build time.
        NEXT_PUBLIC_API_URL: ${WEB_API_URL:-http://backend:3001/api/v1}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
  redisdata:
